version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 10
    reviewers:
      - Patrick4350
    labels:
      - dependencies
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react*'
      supabase:
        patterns:
          - '@supabase/*'
      radix:
        patterns:
          - '@radix-ui/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
